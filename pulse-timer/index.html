<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta id="themeColor" name="theme-color" content="#050505">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pulse Timer</title>
<!-- pulse-timer-clean-rebuild-v1 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Russo+One&display=swap');

:root{
  --app-h:100dvh;
  --page:#050505;
  --phase:#10361a;
  --glass:rgba(5,15,8,.62);
  --line:rgba(255,255,255,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:var(--app-h);min-height:var(--app-h);overflow:hidden;background:var(--page);color:#fff;font-family:Oswald,system-ui,sans-serif;overscroll-behavior:none}
body{touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{border:0}
.hidden{display:none!important}
#app{position:fixed;top:0;left:0;width:100%;height:var(--app-h);min-height:var(--app-h);background:var(--page);overflow:hidden}

/* Splash — only on first page load */
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;overflow:hidden}
.splash.fade{animation:splashFade .42s ease forwards}
.splash-logo{position:relative;z-index:2;text-align:center;animation:logoIn .8s ease both}
.splash-logo svg{width:145px;filter:drop-shadow(0 0 24px rgba(255,255,255,.18))}
.splash-brand{font-family:'Russo One';font-size:16px;letter-spacing:.28em;margin-top:14px}
.splash-ring{position:absolute;width:72vmin;height:72vmin;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 48px rgba(255,255,255,.016),0 0 0 96px rgba(255,255,255,.009);animation:ringPulse 1.45s ease-out infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes ringPulse{from{transform:scale(.72);opacity:.2}to{transform:scale(1.12);opacity:0}}
@keyframes splashFade{to{opacity:0;visibility:hidden}}

/* shared */
.screen,.editor,.timer{position:fixed;top:0;left:0;width:100%;height:var(--app-h);min-height:var(--app-h)}
.icon-btn{display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.25);background:rgba(8,8,8,.58);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-font{font-family:'Russo One',sans-serif}

/* Home */
.screen{
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 14px);
  background:
    radial-gradient(circle at 16% 8%,#242424 0,transparent 34%),
    radial-gradient(circle at 84% 90%,#171717 0,transparent 38%),
    #050505;
  display:flex;
  flex-direction:column;
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto}
.eyebrow{font-size:10px;letter-spacing:.22em;color:#888}
h1,h2,h3,.phase-title{font-family:'Russo One',sans-serif}
h1{font-size:36px;margin:6px 0 0}
.topbar .icon-btn{width:52px;height:52px;border-radius:50%}
.settings{margin:12px 0 0;border:1px solid rgba(255,255,255,.10);border-radius:20px;background:#101010;padding:8px 14px;flex:0 0 auto}
.settings-row{height:50px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07)}
.settings-row:last-child{border-bottom:0}
.switch{position:relative;width:48px;height:28px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch-track{position:absolute;inset:0;border-radius:999px;background:#2a2a2a;border:1px solid rgba(255,255,255,.12);transition:.18s}
.switch-track:after{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;border-radius:50%;background:#8a8a8a;transition:.18s}
.switch input:checked+.switch-track{background:#f1f1f1}
.switch input:checked+.switch-track:after{transform:translateX(20px);background:#111}

.cards{flex:1 1 0;min-height:0;overflow:auto;padding:14px 0 92px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{border:1px solid rgba(255,255,255,.11);border-radius:24px;background:linear-gradient(155deg,#171717,#080808);padding:18px;margin-bottom:12px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card h3{font-size:24px;margin:0}
.card-actions{display:flex;gap:8px}
.small-btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:#111;display:grid;place-items:center;padding:0}
.card-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.card-stats span{display:block;font-size:11px;color:#888}
.card-stats b{font-size:22px;font-weight:500}
.card-foot{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#999}
.fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);backdrop-filter:blur(16px);display:grid;place-items:center}

/* Editor */
.editor{
  overflow:auto;
  background:#050505;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);
}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.editor-head .icon-btn{width:50px;height:50px;border-radius:50%;font-size:30px}
.editor-head h2{font-size:25px;margin:0}
.text-btn{background:transparent;padding:12px 2px;font-size:14px;letter-spacing:.08em}
.name-input{width:100%;height:64px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:#111;color:#fff;padding:0 16px;font-family:'Russo One';font-size:23px;outline:none}
.editor-list{margin-top:12px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:#0d0d0d;overflow:hidden}
.edit-row{display:flex;align-items:center;justify-content:space-between;min-height:76px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.edit-row:last-child{border-bottom:0}
.edit-row>span{font-size:16px;color:#ddd;max-width:45%}
.stepper{display:grid;grid-template-columns:46px 88px 46px;gap:7px;align-items:center}
.stepper button{height:46px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#111;font-size:24px}
.stepper .value-btn{border:0;background:transparent;font-size:26px}
.stepper small{font-size:11px;color:#888;margin-left:2px}
.start-btn{width:100%;height:64px;margin-top:14px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);font-family:'Russo One';font-size:20px}
.delete-btn{width:100%;background:transparent;color:#888;padding:18px}

/* Timer screen — layout uses grid, no overlapping fixed footer */
.timer{
  background:var(--phase);
  overflow:hidden;
  isolation:isolate;
}
.phase-bg{position:absolute;inset:-10%;z-index:0;background:var(--phase);pointer-events:none}
.phase-bg:before,.phase-bg:after{content:"";position:absolute;border-radius:50%;mix-blend-mode:screen;filter:blur(42px) saturate(115%);opacity:.52;animation:morph 7s ease-in-out infinite alternate}
.phase-bg:before{width:118%;height:60%;left:-9%;top:10%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.38) 0 4%,var(--a) 23%,var(--b) 55%,transparent 76%)}
.phase-bg:after{width:96%;height:46%;left:2%;bottom:7%;background:radial-gradient(circle at 50% 50%,var(--c) 0 12%,var(--a) 38%,transparent 72%);animation-duration:5.5s}
.phase-bg.prep{--a:#aaff1f;--b:#24da50;--c:#d9ff72;--phase:#10361a}
.phase-bg.work{--a:#ff4329;--b:#6c4cf7;--c:#ffd05e;--phase:#260b13}
.phase-bg.rest{--a:#5575ff;--b:#7352dd;--c:#a8ddff;--phase:#0b1631}
@keyframes morph{from{transform:translate(-3%,-2%) scale(.94)}to{transform:translate(3%,4%) scale(1.05)}}

.timer-shell{
  position:relative;
  z-index:1;
  height:100%;
  min-height:100%;
  display:grid;
  grid-template-rows:auto auto auto minmax(0,1fr) auto;
  gap:0;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 8px);
}
.timer-head{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;gap:12px}
.timer-head .icon-btn{width:56px;height:56px;border-radius:50%;background:rgba(4,14,7,.64)}
.timer-icon{width:29px;height:29px}
.progress{height:6px;border-radius:999px;background:rgba(255,255,255,.27);overflow:hidden}
.progress i{display:block;height:100%;width:0%;border-radius:999px;background:rgba(229,255,218,.92)}

.timer-hero{text-align:center;padding:18px 0 0}
.timer-sub{font-size:clamp(15px,4.2vw,20px);line-height:1;color:rgba(255,255,255,.72)}
.phase-title{font-size:clamp(42px,9vw,62px);line-height:1;margin-top:18px}
.timer-number{font-family:'Russo One';font-size:clamp(138px,31vw,205px);line-height:.83;margin-top:22px}
.timer-total{font-size:clamp(18px,4.6vw,26px);margin-top:18px;color:rgba(255,255,255,.50)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);min-height:104px;margin-top:24px;border-radius:26px;background:rgba(5,22,8,.56);border:1px solid rgba(255,255,255,.17);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:14px 4px}
.stats div{text-align:center;display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(255,255,255,.12)}
.stats div:last-child{border-right:0}
.stats span{font-size:clamp(13px,3.4vw,18px);color:rgba(255,255,255,.56)}
.stats b{font-size:clamp(30px,7.6vw,42px);line-height:.96;margin-top:9px}

.intervals{min-height:0;overflow:auto;margin-top:14px;padding:0 0 10px;scrollbar-width:none}
.intervals::-webkit-scrollbar{display:none}
.int-row{width:100%;min-height:76px;margin-bottom:10px;border-radius:23px;border:1px solid rgba(255,255,255,.15);background:rgba(4,18,6,.58);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);display:grid;grid-template-columns:36px minmax(0,1fr) max-content;gap:10px;align-items:center;padding:0 18px;text-align:left}
.int-row.current{border:2px solid rgba(255,255,255,.90);background:rgba(137,255,61,.17)}
.int-index{font-size:clamp(18px,4.8vw,24px)}
.int-label{font-family:'Russo One';font-size:clamp(19px,4.8vw,25px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.int-duration{font-size:clamp(24px,6vw,33px);font-weight:600;white-space:nowrap}

.footer-nav{min-height:78px;display:grid;grid-template-columns:62px 1fr 62px;align-items:center;padding-top:4px}
.footer-nav button{width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(4,16,7,.66);display:grid;place-items:center;padding:0}
.footer-nav>div{text-align:center}
.footer-nav small{display:block;font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.52)}
.footer-nav b{display:block;margin-top:5px;font-size:clamp(36px,9vw,50px);line-height:.88;font-weight:500}
.footer-arrow{width:29px;height:29px}

/* Modal + keypad */
.modal,.numpad{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);backdrop-filter:blur(18px);display:flex;align-items:flex-end;padding:14px}
.modal-card,.numpad-card{width:100%;border-radius:26px;background:#111;border:1px solid rgba(255,255,255,.16);padding:18px}
.modal-card h3{font-size:25px;margin:8px 0}
.modal-card p{color:#aaa}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions button{height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:#171717}
.modal-actions .light{background:#fff;color:#000}
.numpad-value{font-size:52px;text-align:center;margin:6px 0 14px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:62px;border-radius:17px;border:1px solid rgba(255,255,255,.14);background:#151515;font-size:27px}

@media (max-height:760px){
  .timer-shell{padding-top:calc(env(safe-area-inset-top) + 12px)}
  .timer-head{grid-template-columns:50px minmax(0,1fr) 50px}
  .timer-head .icon-btn{width:50px;height:50px}
  .timer-hero{padding-top:8px}
  .timer-sub{font-size:13px}
  .phase-title{font-size:34px;margin-top:10px}
  .timer-number{font-size:96px;margin-top:12px}
  .timer-total{font-size:15px;margin-top:10px}
  .stats{min-height:72px;margin-top:12px;padding:8px 4px;border-radius:18px}
  .stats span{font-size:10px}.stats b{font-size:24px;margin-top:4px}
  .intervals{margin-top:8px}
  .int-row{min-height:52px;margin-bottom:6px;border-radius:16px;grid-template-columns:30px minmax(0,1fr) max-content;padding:0 12px}
  .int-index{font-size:16px}.int-label{font-size:17px}.int-duration{font-size:21px}
  .footer-nav{min-height:60px;grid-template-columns:52px 1fr 52px}
  .footer-nav button{width:50px;height:50px}.footer-nav small{font-size:8px}.footer-nav b{font-size:28px;margin-top:3px}
}
</style>
</head>
<body>
<div id="app">

  <div class="splash" id="splash">
    <div class="splash-ring"></div>
    <div class="splash-logo">
      <svg viewBox="0 0 220 220" aria-label="Pulse Timer">
        <circle cx="110" cy="110" r="78" fill="none" stroke="white" stroke-width="8" opacity=".92"/>
        <path d="M35 112h42l14-24 20 64 19-82 17 42h38" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="168" cy="47" r="7" fill="white"/>
      </svg>
      <div class="splash-brand">PULSE TIMER</div>
    </div>
  </div>

  <main class="screen" id="screen">
    <div class="topbar">
      <div><div class="eyebrow">PULSE TIMER</div><h1>ТРЕНИРОВКИ</h1></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Настройки">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9.7 2.6h4.6l.7 2.2 2 .8 2.1-1.1 3.2 3.2-1.1 2.1.8 2 .2.7-.2 1.3-.8 2 1.1 2.1-3.2 3.2-2.1-1.1-2 .8-.7 2.2H9.7L9 19.8l-2-.8-2.1 1.1-3.2-3.2 1.1-2.1-.8-2-.2-.7.2-1.3.8-2-1.1-2.1 3.2-3.2L7 6.6l2-.8.7-2.2Z"/><circle cx="12" cy="12" r="3.1"/></svg>
      </button>
    </div>

    <div class="settings hidden" id="settings">
      <div class="settings-row">
        <span>Звук</span>
        <label class="switch"><input type="checkbox" id="soundToggle"><span class="switch-track"></span></label>
      </div>
      <div class="settings-row">
        <span>Вибрация</span>
        <label class="switch"><input type="checkbox" id="vibrateToggle"><span class="switch-track"></span></label>
      </div>
    </div>

    <section class="cards" id="cards"></section>

    <button class="fab" id="addBtn" aria-label="Добавить тренировку">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </main>

  <section class="editor hidden" id="editor">
    <div class="editor-head">
      <button class="icon-btn" id="editorBack" aria-label="Назад">‹</button>
      <h2>ТРЕНИРОВКА</h2>
      <button class="text-btn" id="saveBtn">ГОТОВО</button>
    </div>

    <input class="name-input" id="nameInput" maxlength="32" autocomplete="off" spellcheck="false">
    <div class="editor-list" id="editorList"></div>
    <button class="start-btn" id="editorStart">СТАРТ</button>
    <button class="delete-btn" id="deleteBtn">Удалить тренировку</button>
  </section>

  <section class="timer hidden" id="timer">
    <div class="phase-bg prep" id="phaseBg"></div>
    <div class="timer-shell">
      <div class="timer-head">
        <button class="icon-btn" id="exitBtn" aria-label="Назад">
          <svg class="icon timer-icon" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div class="progress"><i id="progressBar"></i></div>
        <button class="icon-btn" id="pauseBtn" aria-label="Пауза">
          <svg class="icon timer-icon" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
        </button>
      </div>

      <div class="timer-hero">
        <div class="timer-sub" id="timerSub"></div>
        <div class="phase-title" id="phaseTitle">ПОДГОТОВКА</div>
        <div class="timer-number" id="timerNumber">10</div>
        <div class="timer-total" id="timerTotal">/ 10 сек</div>
      </div>

      <div class="stats">
        <div><span>Осталось</span><b id="remainTotal">0:00</b></div>
        <div><span>Всего</span><b id="allTotal">0:00</b></div>
      </div>

      <div class="intervals" id="intervals"></div>

      <div class="footer-nav">
        <button id="prevBtn" aria-label="Предыдущий интервал">
          <svg class="icon footer-arrow" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <div><small>ИНТЕРВАЛ</small><b id="intervalCounter">1/1</b></div>
        <button id="nextBtn" aria-label="Следующий интервал">
          <svg class="icon footer-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </section>

  <div class="modal hidden" id="exitModal">
    <div class="modal-card">
      <div class="eyebrow">ТРЕНИРОВКА ИДЁТ</div>
      <h3>Выйти из тренировки?</h3>
      <p>Текущий прогресс будет сброшен.</p>
      <div class="modal-actions">
        <button id="continueBtn">Продолжить</button>
        <button id="confirmExitBtn" class="light">Выйти</button>
      </div>
    </div>
  </div>

  <div class="numpad hidden" id="numpad">
    <div class="numpad-card">
      <div class="numpad-value" id="numpadValue">0</div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'w-' + Date.now() + '-' + Math.random().toString(16).slice(2));
  const fmt = s => {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2,'0');
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const DEFAULTS = [
    {id:'press',name:'ПРЕСС',prep:10,work:30,rest:80,cycles:9,sets:1,setRest:150,coolDown:0},
    {id:'training',name:'ТРЕНИРОВКА',prep:30,work:30,rest:150,cycles:12,sets:3,setRest:180,coolDown:0}
  ];

  // Fresh state: deliberately does not import previously broken localStorage.
  const STORAGE = 'pulse-timer-clean-v1-workouts';
  const PREFS = 'pulse-timer-clean-v1-prefs';

  const normalize = w => ({
    id:String(w?.id || uid()),
    name:String(w?.name || 'ТРЕНИРОВКА').toUpperCase(),
    prep:Math.max(0,Number(w?.prep ?? 10) || 0),
    work:Math.max(1,Number(w?.work ?? 30) || 30),
    rest:Math.max(0,Number(w?.rest ?? 60) || 0),
    cycles:Math.max(1,Number(w?.cycles ?? 8) || 8),
    sets:Math.max(1,Number(w?.sets ?? 1) || 1),
    setRest:Math.max(0,Number(w?.setRest ?? 120) || 0),
    coolDown:Math.max(0,Number(w?.coolDown ?? 0) || 0)
  });

  function loadWorkouts(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE) || 'null');
      if(Array.isArray(saved) && saved.length) return saved.map(normalize);
    }catch{}
    const fresh = DEFAULTS.map(x=>({...x}));
    localStorage.setItem(STORAGE, JSON.stringify(fresh));
    return fresh;
  }

  let workouts = loadWorkouts();
  let prefs = {sound:true,vibrate:true};
  try{prefs={...prefs,...JSON.parse(localStorage.getItem(PREFS)||'{}')}}catch{}
  let sound = !!prefs.sound;
  let vibrate = !!prefs.vibrate;

  let editing = null;
  let active = null;
  let phases = [];
  let phaseIndex = 0;
  let remainingMs = 0;
  let deadline = 0;
  let running = false;
  let tickId = null;
  let resumeAfterModal = false;
  let lastCountdownSec = null;
  let padField = null;
  let padDraft = '0';
  let audioCtx = null;

  const fieldMeta = [
    ['prep','Подготовка','сек',0,5],
    ['work','Работа','сек',1,5],
    ['rest','Отдых','сек',0,5],
    ['cycles','Циклы','',1,1],
    ['sets','Подходы','',1,1],
    ['setRest','Отдых между подходами','сек',0,5],
    ['coolDown','Заминка','сек',0,5]
  ];

  function saveWorkouts(){localStorage.setItem(STORAGE,JSON.stringify(workouts))}
  function savePrefs(){localStorage.setItem(PREFS,JSON.stringify({sound,vibrate}))}
  function ensureAudio(){
    if(!audioCtx){
      try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch{}
    }
    if(audioCtx?.state==='suspended') audioCtx.resume().catch(()=>{});
  }
  function beep(freq=900,dur=.1){
    if(!sound) return;
    ensureAudio();
    if(!audioCtx) return;
    try{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='square';o.frequency.value=freq;g.gain.value=.13;
      o.connect(g);g.connect(audioCtx.destination);
      o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);
    }catch{}
  }
  function haptic(pattern=12){
    if(!vibrate) return;
    try{navigator.vibrate?.(pattern)}catch{}
  }

  function buildPhases(w){
    const out=[];
    if(w.prep>0) out.push({label:'ПОДГОТОВКА',duration:w.prep,type:'prep',set:1,cycle:0});
    for(let s=1;s<=w.sets;s++){
      for(let c=1;c<=w.cycles;c++){
        out.push({label:'РАБОТА',duration:w.work,type:'work',set:s,cycle:c});
        if(c<w.cycles && w.rest>0) out.push({label:'ОТДЫХ',duration:w.rest,type:'rest',set:s,cycle:c});
      }
      if(s<w.sets && w.setRest>0) out.push({label:'ОТДЫХ МЕЖДУ ПОДХОДАМИ',duration:w.setRest,type:'rest',set:s,cycle:w.cycles});
    }
    if(w.coolDown>0) out.push({label:'ЗАМИНКА',duration:w.coolDown,type:'rest',set:w.sets,cycle:w.cycles});
    return out;
  }
  function totalSeconds(w){return buildPhases(w).reduce((a,p)=>a+p.duration,0)}

  function show(id){
    ['screen','editor','timer'].forEach(x=>$(x).classList.add('hidden'));
    $(id).classList.remove('hidden');
  }

  function renderCards(){
    $('cards').innerHTML=workouts.map(w=>`
      <article class="card">
        <div class="card-top">
          <h3>${esc(w.name)}</h3>
          <div class="card-actions">
            <button class="small-btn edit-btn" data-id="${w.id}" aria-label="Изменить">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="small-btn play-btn" data-id="${w.id}" aria-label="Запустить">
              <svg class="icon" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg>
            </button>
          </div>
        </div>
        <div class="card-stats">
          <div><span>Работа</span><b>${w.work}</b></div>
          <div><span>Отдых</span><b>${w.rest}</b></div>
          <div><span>Циклы</span><b>${w.cycles}</b></div>
          <div><span>Подходы</span><b>${w.sets}</b></div>
        </div>
        <div class="card-foot">Всего: ${fmt(totalSeconds(w))} · ${buildPhases(w).length} интервалов</div>
      </article>
    `).join('');
  }

  function openEditor(id){
    const existing=id?workouts.find(w=>w.id===id):null;
    editing=existing?{...existing}:{id:uid(),name:'НОВАЯ ТРЕНИРОВКА',prep:10,work:30,rest:60,cycles:8,sets:1,setRest:120,coolDown:0};
    $('nameInput').value=editing.name;
    $('deleteBtn').classList.toggle('hidden',!existing);
    renderEditor();
    show('editor');
  }

  function renderEditor(){
    $('editorList').innerHTML=fieldMeta.map(([key,label,unit,min,step])=>`
      <div class="edit-row">
        <span>${label}</span>
        <div class="stepper">
          <button class="adjust-btn" data-key="${key}" data-delta="-${step}" data-min="${min}">−</button>
          <button class="value-btn pad-btn" data-key="${key}">${editing[key]}${unit?`<small>${unit}</small>`:''}</button>
          <button class="adjust-btn" data-key="${key}" data-delta="${step}" data-min="${min}">＋</button>
        </div>
      </div>
    `).join('');
  }

  function commitEditor(){
    editing.name=($('nameInput').value.trim()||'ТРЕНИРОВКА').toUpperCase();
    const clean=normalize(editing);
    const idx=workouts.findIndex(w=>w.id===clean.id);
    if(idx>=0) workouts[idx]=clean; else workouts.unshift(clean);
    editing=clean;
    saveWorkouts();
    renderCards();
  }

  function openPad(key){
    padField=key;
    padDraft=String(editing[key]??0);
    $('numpadValue').textContent=padDraft;
    $('numpad').classList.remove('hidden');
  }

  const keys=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  $('keys').innerHTML=keys.map(k=>`<button data-key="${k}">${k}</button>`).join('');

  function startWorkout(w){
    ensureAudio();
    active=normalize(w);
    phases=buildPhases(active);
    if(!phases.length) return;
    phaseIndex=0;
    remainingMs=phases[0].duration*1000;
    deadline=Date.now()+remainingMs;
    running=true;
    lastCountdownSec=null;
    show('timer');
    renderTimer(true);
    updatePauseIcon();
    startTicker();
    haptic([24,30,48]);
    beep(980,.10);
  }

  function startTicker(){
    clearInterval(tickId);
    tickId=setInterval(()=>{
      if(!running||!active) return;
      remainingMs=Math.max(0,deadline-Date.now());
      if(remainingMs<=0){
        nextPhase(true);
        return;
      }
      const sec=Math.ceil(remainingMs/1000);
      if(sec<=3&&sec>=1&&sec!==lastCountdownSec){
        lastCountdownSec=sec;
        haptic(sec===1?[40,25,70]:18);
        beep(1200,.07);
      }
      renderTimer(false);
    },200);
  }

  function nextPhase(auto){
    const next=phaseIndex+1;
    if(next>=phases.length){
      running=false;
      remainingMs=0;
      renderTimer(false);
      updatePauseIcon();
      if(auto){beep(820,.28);haptic([60,40,100])}
      return;
    }
    phaseIndex=next;
    remainingMs=phases[phaseIndex].duration*1000;
    deadline=Date.now()+remainingMs;
    lastCountdownSec=null;
    const p=phases[phaseIndex];
    if(auto){beep(p.type==='work'?1080:620,.13);haptic(p.type==='work'?[34,28,65]:24)}
    renderTimer(true);
  }

  function previousPhase(){
    phaseIndex=Math.max(0,phaseIndex-1);
    remainingMs=phases[phaseIndex].duration*1000;
    deadline=Date.now()+remainingMs;
    lastCountdownSec=null;
    renderTimer(true);
    haptic(12);
  }

  function selectPhase(index){
    if(index<0||index>=phases.length) return;
    phaseIndex=index;
    remainingMs=phases[index].duration*1000;
    deadline=Date.now()+remainingMs;
    lastCountdownSec=null;
    renderTimer(true);
    haptic(12);
  }

  function renderTimer(scroll){
    if(!active||!phases.length) return;
    const p=phases[phaseIndex];
    const chrome=p.type==='prep'?'#10361a':p.type==='work'?'#260b13':'#0b1631';
    document.documentElement.style.setProperty('--phase',chrome);
    document.documentElement.style.setProperty('--page',chrome);
    $('phaseBg').className='phase-bg '+p.type;
    $('themeColor').setAttribute('content',chrome);

    const total=phases.reduce((s,x)=>s+x.duration,0);
    const before=phases.slice(0,phaseIndex).reduce((s,x)=>s+x.duration,0);
    const currentElapsed=Math.max(0,p.duration-remainingMs/1000);
    const elapsed=before+currentElapsed;

    $('timerSub').textContent='Подход '+p.set+'/'+active.sets+' · Цикл '+Math.max(1,p.cycle)+'/'+active.cycles;
    $('phaseTitle').textContent=p.label;
    $('timerNumber').textContent=Math.max(0,Math.ceil(remainingMs/1000));
    $('timerTotal').textContent='/ '+p.duration+' сек';
    $('remainTotal').textContent=fmt(Math.max(0,total-elapsed));
    $('allTotal').textContent=fmt(total);
    $('progressBar').style.width=(total?Math.min(100,elapsed/total*100):0)+'%';
    $('intervalCounter').textContent=(phaseIndex+1)+'/'+phases.length;

    $('intervals').innerHTML=phases.map((x,i)=>`
      <button class="int-row ${i===phaseIndex?'current':''}" data-index="${i}">
        <span class="int-index">${i+1}</span>
        <b class="int-label">${esc(x.label)}</b>
        <span class="int-duration">${x.duration} сек</span>
      </button>
    `).join('');

    if(scroll) requestAnimationFrame(()=>document.querySelector('.int-row.current')?.scrollIntoView({block:'nearest',behavior:'smooth'}));
  }

  function updatePauseIcon(){
    $('pauseBtn').innerHTML=running
      ? '<svg class="icon timer-icon" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>'
      : '<svg class="icon timer-icon" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg>';
  }

  $('cards').addEventListener('click',e=>{
    const edit=e.target.closest('.edit-btn');
    const play=e.target.closest('.play-btn');
    if(edit){openEditor(edit.dataset.id);haptic(10)}
    if(play){const w=workouts.find(x=>x.id===play.dataset.id);if(w)startWorkout(w)}
  });

  $('addBtn').addEventListener('click',()=>{openEditor(null);haptic(10)});
  $('settingsBtn').addEventListener('click',()=>$('settings').classList.toggle('hidden'));

  $('editorList').addEventListener('click',e=>{
    const adj=e.target.closest('.adjust-btn');
    const pad=e.target.closest('.pad-btn');
    if(adj){
      const key=adj.dataset.key,min=Number(adj.dataset.min),delta=Number(adj.dataset.delta);
      editing[key]=Math.max(min,Number(editing[key])+delta);
      renderEditor();haptic(8);
    }else if(pad) openPad(pad.dataset.key);
  });

  $('keys').addEventListener('click',e=>{
    const k=e.target.dataset.key;
    if(!k)return;
    haptic(8);
    if(k==='⌫') padDraft=padDraft.slice(0,-1);
    else if(k==='✓'){
      const meta=fieldMeta.find(x=>x[0]===padField);
      editing[padField]=Math.max(meta?meta[3]:0,Number(padDraft||0));
      $('numpad').classList.add('hidden');
      renderEditor();
      return;
    }else padDraft=(padDraft==='0'?k:padDraft+k).slice(0,5);
    $('numpadValue').textContent=padDraft||'0';
  });

  $('numpad').addEventListener('click',e=>{if(e.target===$('numpad'))$('numpad').classList.add('hidden')});

  $('editorBack').addEventListener('click',()=>show('screen'));
  $('saveBtn').addEventListener('click',()=>{commitEditor();show('screen');haptic(12)});
  $('editorStart').addEventListener('click',()=>{commitEditor();startWorkout(editing)});
  $('deleteBtn').addEventListener('click',()=>{
    if(!editing)return;
    if(confirm('Удалить тренировку?')){
      workouts=workouts.filter(w=>w.id!==editing.id);
      saveWorkouts();renderCards();show('screen');
    }
  });

  $('pauseBtn').addEventListener('click',()=>{
    if(!active)return;
    if(running){
      remainingMs=Math.max(0,deadline-Date.now());
      running=false;
    }else{
      if(remainingMs<=0) remainingMs=phases[phaseIndex].duration*1000;
      deadline=Date.now()+remainingMs;
      running=true;
      ensureAudio();
    }
    updatePauseIcon();haptic(12);
  });

  $('prevBtn').addEventListener('click',previousPhase);
  $('nextBtn').addEventListener('click',()=>{if(phaseIndex<phases.length-1)nextPhase(false)});
  $('intervals').addEventListener('click',e=>{
    const row=e.target.closest('.int-row');
    if(row)selectPhase(Number(row.dataset.index));
  });

  $('exitBtn').addEventListener('click',()=>{
    if(!active)return;
    resumeAfterModal=running;
    if(running){
      remainingMs=Math.max(0,deadline-Date.now());
      running=false;
      updatePauseIcon();
    }
    $('exitModal').classList.remove('hidden');
  });

  $('continueBtn').addEventListener('click',()=>{
    $('exitModal').classList.add('hidden');
    if(active&&resumeAfterModal&&remainingMs>0){
      deadline=Date.now()+remainingMs;
      running=true;
      updatePauseIcon();
    }
  });

  $('confirmExitBtn').addEventListener('click',()=>{
    $('exitModal').classList.add('hidden');
    running=false;active=null;phases=[];clearInterval(tickId);
    document.documentElement.style.setProperty('--phase','#10361a');
    document.documentElement.style.setProperty('--page','#050505');
    $('themeColor').setAttribute('content','#050505');
    show('screen');renderCards();
  });

  $('soundToggle').checked=sound;
  $('vibrateToggle').checked=vibrate;
  $('soundToggle').addEventListener('change',e=>{sound=e.target.checked;savePrefs();if(sound)beep(920,.08)});
  $('vibrateToggle').addEventListener('change',e=>{vibrate=e.target.checked;savePrefs();if(vibrate)haptic(18)});

  ['gesturestart','gesturechange'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches?.length>1)e.preventDefault()},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());

  function syncViewportHeight(){
    const portrait=window.matchMedia('(orientation: portrait)').matches;
    const sw=Number(window.screen?.width)||0;
    const sh=Number(window.screen?.height)||0;
    const physicalH=sw&&sh?(portrait?Math.max(sw,sh):Math.min(sw,sh)):0;
    const visualH=Number(window.visualViewport?.height)||0;
    const innerH=Number(window.innerHeight)||0;
    const h=Math.max(physicalH,visualH,innerH);
    if(h>0) document.documentElement.style.setProperty('--app-h',Math.round(h)+'px');
  }
  syncViewportHeight();
  window.addEventListener('resize',syncViewportHeight);
  window.addEventListener('orientationchange',()=>setTimeout(syncViewportHeight,120));
  window.visualViewport?.addEventListener('resize',syncViewportHeight);

  renderCards();

  const started=performance.now();
  const waitLoad=document.readyState==='complete'?Promise.resolve():new Promise(r=>window.addEventListener('load',r,{once:true}));
  const waitFonts=document.fonts?.ready?document.fonts.ready.catch(()=>{}):Promise.resolve();
  Promise.race([Promise.all([waitLoad,waitFonts]),new Promise(r=>setTimeout(r,1500))]).then(()=>{
    const delay=Math.max(0,650-(performance.now()-started));
    setTimeout(()=>{
      $('splash').classList.add('fade');
      setTimeout(()=>$('splash').classList.add('hidden'),430);
    },delay);
  });
})();
</script>
</body>
</html>
