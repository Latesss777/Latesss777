<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta id="themeColor" name="theme-color" content="#07190d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pulse Timer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Russo+One&display=swap');
:root{--chrome:#07190d;--glass:rgba(5,16,8,.62);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;background:var(--chrome);overflow:hidden;overscroll-behavior:none;color:#fff;font-family:Oswald,system-ui,sans-serif}
body{touch-action:pan-x pan-y}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{position:fixed;inset:0;width:100%;height:100dvh;min-height:100dvh;background:var(--chrome);overflow:hidden}

/* splash: initial load only */
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;overflow:hidden}
.splash.hide{animation:splashOut .42s ease forwards}
.logo-wrap{text-align:center;animation:logoIn .85s ease both}
.logo{width:150px;filter:drop-shadow(0 0 24px rgba(255,255,255,.2))}
.brand{font-family:'Russo One';font-size:17px;letter-spacing:.28em;margin-top:14px}
.rings{position:absolute;width:72vmin;height:72vmin;border-radius:50%;border:1px solid rgba(255,255,255,.10);box-shadow:0 0 0 48px rgba(255,255,255,.018),0 0 0 96px rgba(255,255,255,.010);animation:ring 1.45s ease-out infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes ring{from{transform:scale(.74);opacity:.2}to{transform:scale(1.12);opacity:0}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* shared */
.screen,.editor,.timer{position:fixed;inset:0}
.icon-btn{border:1px solid rgba(255,255,255,.28);background:rgba(5,10,7,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;padding:0}
.ui-icon{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* home */
.screen{padding:max(18px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background:radial-gradient(circle at 18% 5%,#252525 0,transparent 34%),radial-gradient(circle at 82% 92%,#181818 0,transparent 36%),#050505}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:10px;letter-spacing:.23em;color:#8c8c8c}
h1,h2,h3,.phase-title{font-family:'Russo One',sans-serif}
h1{font-size:38px;margin:6px 0 0}
.topbar .icon-btn{width:52px;height:52px;border-radius:50%}
.settings{margin:14px 0;border:1px solid rgba(255,255,255,.10);border-radius:20px;background:#111;padding:8px 14px}
.settings label{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07)}
.settings label:last-child{border:0}
.switch{position:relative;width:48px;height:28px}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{position:absolute;inset:0;border-radius:999px;background:#292929;border:1px solid rgba(255,255,255,.12)}
.track:after{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;border-radius:50%;background:#8c8c8c;transition:.18s}
.switch input:checked+.track{background:#f1f1f1}
.switch input:checked+.track:after{transform:translateX(20px);background:#111}
.cards{height:calc(100dvh - 112px - env(safe-area-inset-top));overflow:auto;padding:14px 0 100px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{border:1px solid rgba(255,255,255,.11);border-radius:24px;background:linear-gradient(155deg,#171717,#080808);padding:18px;margin-bottom:12px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card h3{font-size:25px;margin:0}
.card-actions{display:flex;gap:8px}
.small-btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:#111;display:grid;place-items:center;padding:0}
.card-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.card-stats span{display:block;font-size:11px;color:#888}
.card-stats b{font-size:23px;font-weight:500}
.card-foot{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#999}
.fab{position:absolute;right:18px;bottom:max(18px,env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);backdrop-filter:blur(16px);display:grid;place-items:center}

/* editor */
.editor{overflow:auto;background:#050505;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.editor-head .icon-btn{width:50px;height:50px;border-radius:50%;font-size:30px}
.editor-head h2{font-size:26px;margin:0}
.text-btn{border:0;background:transparent;padding:12px 2px;font-size:14px;letter-spacing:.08em}
.name-input{width:100%;height:66px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:#111;color:#fff;padding:0 16px;font-family:'Russo One';font-size:24px}
.editor-list{margin-top:12px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:#0d0d0d;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;min-height:78px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.row:last-child{border:0}
.row>span{font-size:16px;color:#ddd;max-width:46%}
.step{display:grid;grid-template-columns:46px 88px 46px;gap:7px;align-items:center}
.step button{height:46px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#111;font-size:24px}
.step .val{border:0;background:transparent;font-size:26px}
.step small{font-size:11px;color:#888;margin-left:2px}
.start-btn{width:100%;height:66px;margin-top:14px;border-radius:21px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);font-family:'Russo One';font-size:21px}
.delete-btn{width:100%;border:0;background:transparent;color:#888;padding:18px}

/* timer */
.timer{padding:0 18px;background:var(--chrome);overflow:hidden;isolation:isolate;display:flex;flex-direction:column}
.phase-bg{position:fixed;z-index:0;top:-80px;left:-42px;right:-42px;bottom:-240px;background:var(--phase-base);overflow:hidden;pointer-events:none}
.phase-bg:before,.phase-bg:after{content:"";position:absolute;border-radius:50%;mix-blend-mode:screen;filter:blur(40px) saturate(118%);opacity:.56;animation:morph 7s ease-in-out infinite alternate}
.phase-bg:before{width:118%;height:62%;left:-9%;top:12%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.46) 0 4%,var(--a) 22%,var(--b) 54%,transparent 75%)}
.phase-bg:after{width:100%;height:48%;left:0;bottom:6%;background:radial-gradient(circle at 50% 50%,var(--c) 0 12%,var(--a) 38%,transparent 72%);animation-duration:5.5s}
.phase-bg.prep{--a:#b8ff20;--b:#27ec58;--c:#dfff79;--phase-base:#10361a}
.phase-bg.work{--a:#ff4227;--b:#704cff;--c:#ffd15d;--phase-base:#260b13}
.phase-bg.rest{--a:#5577ff;--b:#7555e5;--c:#aee1ff;--phase-base:#0b1631}
@keyframes morph{from{transform:translate(-3%,-2%) scale(.94)}to{transform:translate(3%,4%) scale(1.05)}}
.timer>*:not(.phase-bg){position:relative;z-index:1}
.timer-head{height:calc(98px + env(safe-area-inset-top));padding-top:calc(env(safe-area-inset-top) + 24px);display:flex;align-items:flex-start;gap:12px;flex:0 0 auto}
.timer-head .icon-btn{width:58px;height:58px;flex:0 0 58px;border-radius:50%;background:rgba(5,15,8,.64)}
.timer-control-icon{width:30px;height:30px;stroke-width:2.35}
.progress{height:6px;flex:1;margin:26px 10px 0;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden}
.progress i{display:block;height:100%;border-radius:999px;background:rgba(226,255,214,.92);width:0%}
.timer-hero{text-align:center;flex:0 0 auto;padding-top:2px}
.timer-sub{font-size:clamp(16px,4.5vw,21px);line-height:1;color:rgba(255,255,255,.74)}
.phase-title{font-size:clamp(44px,9vw,64px);line-height:1;margin-top:22px}
.timer-number{font-family:'Russo One';font-size:clamp(150px,34vw,220px);line-height:.82;margin-top:24px}
.timer-total{font-size:clamp(20px,5vw,28px);margin-top:24px;color:rgba(255,255,255,.52)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);min-height:116px;margin-top:28px;border-radius:28px;background:rgba(5,22,8,.58);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:18px 4px;flex:0 0 auto}
.stats div{text-align:center;display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(255,255,255,.13)}
.stats div:last-child{border:0}
.stats span{font-size:clamp(14px,3.8vw,19px);color:rgba(255,255,255,.58)}
.stats b{font-size:clamp(32px,8.2vw,44px);line-height:.95;margin-top:11px}
.intervals{flex:1 1 0;min-height:0;overflow:auto;margin-top:18px;padding-bottom:calc(126px + env(safe-area-inset-bottom));scrollbar-width:none}
.intervals::-webkit-scrollbar{display:none}
.int-row{width:100%;min-height:88px;margin-bottom:12px;border-radius:25px;border:1px solid rgba(255,255,255,.15);background:rgba(4,18,6,.60);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;grid-template-columns:42px minmax(0,1fr) max-content;gap:10px;align-items:center;padding:0 20px;text-align:left}
.int-row.current{border:2px solid rgba(255,255,255,.90);background:rgba(141,255,58,.18)}
.int-index{font-size:clamp(20px,5vw,26px)}
.int-label{font-family:'Russo One';font-size:clamp(20px,5.1vw,27px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.int-duration{font-size:clamp(27px,6.5vw,36px);font-weight:600;white-space:nowrap}
.footer-nav{position:absolute!important;left:20px;right:20px;bottom:max(12px,env(safe-area-inset-bottom));height:86px;display:grid;grid-template-columns:66px 1fr 66px;align-items:center;z-index:5}
.footer-nav button{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.24);background:rgba(4,16,7,.68);display:grid;place-items:center;padding:0}
.footer-nav>div{text-align:center}
.footer-nav small{display:block;font-size:12px;letter-spacing:.22em;color:rgba(255,255,255,.54)}
.footer-nav b{display:block;margin-top:7px;font-size:clamp(38px,10vw,52px);line-height:.86;font-weight:500}
.footer-arrow{width:31px;height:31px}

/* overlays */
.modal,.numpad{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);backdrop-filter:blur(18px);display:flex;align-items:flex-end;padding:14px}
.modal-card,.numpad-card{width:100%;border-radius:26px;background:#111;border:1px solid rgba(255,255,255,.16);padding:18px}
.modal-card h3{font-size:26px;margin:8px 0}
.modal-card p{color:#aaa}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-actions button{height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:#171717}
.modal-actions .light{background:#fff;color:#000}
.numpad-value{font-size:54px;text-align:center;margin:6px 0 14px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:64px;border-radius:17px;border:1px solid rgba(255,255,255,.14);background:#151515;font-size:27px}

@media (orientation:landscape) and (max-height:700px){
  .timer{padding:0 16px}
  .timer-head{height:calc(74px + env(safe-area-inset-top));padding-top:calc(env(safe-area-inset-top) + 16px)}
  .timer-head .icon-btn{width:50px;height:50px;flex-basis:50px}
  .progress{height:5px;margin:22px 9px 0}
  .timer-sub{font-size:12px}
  .phase-title{font-size:30px;margin-top:7px}
  .timer-number{font-size:76px;margin-top:8px}
  .timer-total{font-size:13px;margin-top:7px}
  .stats{min-height:58px;margin-top:7px;padding:7px 4px;border-radius:16px}
  .stats span{font-size:9px}.stats b{font-size:19px;margin-top:4px}
  .intervals{margin-top:7px;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  .int-row{min-height:44px;margin-bottom:5px;border-radius:14px;grid-template-columns:28px minmax(0,1fr) max-content;padding:0 12px}
  .int-index{font-size:15px}.int-label{font-size:16px}.int-duration{font-size:20px}
  .footer-nav{bottom:max(4px,env(safe-area-inset-bottom));height:58px;grid-template-columns:52px 1fr 52px}
  .footer-nav button{width:50px;height:50px}.footer-nav small{font-size:8px}.footer-nav b{margin-top:3px;font-size:26px}
}

/* === HOME BOTTOM BACKGROUND FIX v8 === */
.screen{
  min-height:100dvh!important;
  height:100dvh!important;
  background:
    radial-gradient(circle at 18% 5%,#252525 0,transparent 34%),
    radial-gradient(circle at 82% 92%,#1a1a1a 0,transparent 38%),
    #101010!important;
}
.screen::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:#101010;
  pointer-events:none;
}
.cards{
  background:transparent!important;
}

</style>
</head>
<body>
<div id="app">
  <div class="splash" id="splash">
    <div class="rings"></div>
    <div class="logo-wrap">
      <svg class="logo" viewBox="0 0 220 220" aria-label="Pulse Timer">
        <circle cx="110" cy="110" r="78" fill="none" stroke="white" stroke-width="8" opacity=".92"/>
        <path d="M35 112h42l14-24 20 64 19-82 17 42h38" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="168" cy="47" r="7" fill="white"/>
      </svg>
      <div class="brand">PULSE TIMER</div>
    </div>
  </div>

  <main class="screen" id="screen">
    <div class="topbar">
      <div><div class="eyebrow">PULSE TIMER</div><h1>ТРЕНИРОВКИ</h1></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Настройки">
        <svg class="ui-icon" viewBox="0 0 24 24"><path d="M9.7 2.6h4.6l.7 2.2 2 .8 2.1-1.1 3.2 3.2-1.1 2.1.8 2 .2.7-.2 1.3-.8 2 1.1 2.1-3.2 3.2-2.1-1.1-2 .8-.7 2.2H9.7L9 19.8l-2-.8-2.1 1.1-3.2-3.2 1.1-2.1-.8-2-.2-.7.2-1.3.8-2-1.1-2.1 3.2-3.2L7 6.6l2-.8.7-2.2Z"/><circle cx="12" cy="12" r="3.1"/></svg>
      </button>
    </div>
    <div class="settings hidden" id="settings">
      <label><span>Звук</span><span class="switch"><input type="checkbox" id="soundToggle"><span class="track"></span></span></label>
      <label><span>Вибрация</span><span class="switch"><input type="checkbox" id="vibrateToggle"><span class="track"></span></span></label>
    </div>
    <section class="cards" id="cards"></section>
    <button class="fab" id="addBtn" aria-label="Добавить тренировку"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </main>

  <section class="editor hidden" id="editor">
    <div class="editor-head">
      <button class="icon-btn" id="editorBack" aria-label="Назад">‹</button>
      <h2>ТРЕНИРОВКА</h2>
      <button class="text-btn" id="saveBtn">ГОТОВО</button>
    </div>
    <input class="name-input" id="nameInput" maxlength="32" autocomplete="off" spellcheck="false">
    <div class="editor-list" id="editorList"></div>
    <button class="start-btn" id="editorStart">СТАРТ</button>
    <button class="delete-btn" id="deleteBtn">Удалить тренировку</button>
  </section>

  <section class="timer hidden" id="timer">
    <div class="phase-bg prep" id="phaseBg"></div>
    <div class="timer-head">
      <button class="icon-btn" id="exitBtn" aria-label="Назад"><svg class="ui-icon timer-control-icon" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      <div class="progress"><i id="progressBar"></i></div>
      <button class="icon-btn" id="pauseBtn" aria-label="Пауза"><svg class="ui-icon timer-control-icon" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    </div>

    <div class="timer-hero">
      <div class="timer-sub" id="timerSub"></div>
      <div class="phase-title" id="phaseTitle">ПОДГОТОВКА</div>
      <div class="timer-number" id="timerNumber">10</div>
      <div class="timer-total" id="timerTotal">/ 10 сек</div>
    </div>

    <div class="stats">
      <div><span>Осталось</span><b id="remainTotal">0:00</b></div>
      <div><span>Всего</span><b id="allTotal">0:00</b></div>
    </div>

    <div class="intervals" id="intervals"></div>

    <div class="footer-nav">
      <button id="prevBtn" aria-label="Предыдущий интервал"><svg class="ui-icon footer-arrow" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      <div><small>ИНТЕРВАЛ</small><b id="intervalCounter">1/1</b></div>
      <button id="nextBtn" aria-label="Следующий интервал"><svg class="ui-icon footer-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </section>

  <div class="modal hidden" id="exitModal">
    <div class="modal-card">
      <div class="eyebrow">ТРЕНИРОВКА ИДЁТ</div>
      <h3>Выйти из тренировки?</h3>
      <p>Текущий прогресс будет сброшен.</p>
      <div class="modal-actions"><button id="continueBtn">Продолжить</button><button id="confirmExitBtn" class="light">Выйти</button></div>
    </div>
  </div>

  <div class="numpad hidden" id="numpad">
    <div class="numpad-card">
      <div class="numpad-value" id="numpadValue">0</div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'w-' + Date.now() + '-' + Math.random().toString(16).slice(2));
  const fmt = s => {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };

  const DEFAULTS = [
    {id:'press',name:'ПРЕСС',prep:10,work:30,rest:80,cycles:9,sets:1,setRest:150,coolDown:0},
    {id:'training',name:'ТРЕНИРОВКА',prep:30,work:30,rest:150,cycles:12,sets:3,setRest:180,coolDown:0}
  ];

  const STORAGE = 'pulse-timer-workouts-v3';
  const PREFS = 'pulse-timer-prefs-v2';
  const legacyKeys = ['pulse-timer-standalone-v2','pulse-timer-standalone-v1'];

  const normalize = w => ({
    id: String(w && w.id ? w.id : uid()),
    name: String(w && w.name ? w.name : 'ТРЕНИРОВКА').toUpperCase(),
    prep: Math.max(0, Number(w && w.prep != null ? w.prep : 10) || 0),
    work: Math.max(1, Number(w && w.work != null ? w.work : 30) || 30),
    rest: Math.max(0, Number(w && w.rest != null ? w.rest : 60) || 0),
    cycles: Math.max(1, Number(w && w.cycles != null ? w.cycles : 8) || 8),
    sets: Math.max(1, Number(w && w.sets != null ? w.sets : 1) || 1),
    setRest: Math.max(0, Number(w && w.setRest != null ? w.setRest : 120) || 0),
    coolDown: Math.max(0, Number(w && w.coolDown != null ? w.coolDown : 0) || 0)
  });

  function loadWorkouts(){
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE) || 'null'); } catch {}
    if (!Array.isArray(saved)) {
      for (const key of legacyKeys) {
        try {
          const x = JSON.parse(localStorage.getItem(key) || 'null');
          if (Array.isArray(x)) { saved = x; break; }
        } catch {}
      }
    }
    if (!Array.isArray(saved)) saved = [];
    const map = new Map(DEFAULTS.map(w => [w.id, {...w}]));
    for (const raw of saved) {
      if (!raw || typeof raw !== 'object') continue;
      const w = normalize(raw);
      map.set(w.id, map.has(w.id) ? {...map.get(w.id), ...w} : w);
    }
    return Array.from(map.values());
  }

  let workouts = loadWorkouts();
  let prefs = {sound:true,vibrate:true};
  try { prefs = {...prefs, ...JSON.parse(localStorage.getItem(PREFS) || '{}')}; } catch {}
  let sound = !!prefs.sound;
  let vibrate = !!prefs.vibrate;

  let editing = null;
  let active = null;
  let phases = [];
  let phaseIndex = 0;
  let remainingMs = 0;
  let deadline = 0;
  let running = false;
  let tickId = null;
  let padField = null;
  let padDraft = '0';

  function saveWorkouts(){ localStorage.setItem(STORAGE, JSON.stringify(workouts)); }
  function savePrefs(){ localStorage.setItem(PREFS, JSON.stringify({sound,vibrate})); }

  function haptic(pattern=12){
    if (!vibrate) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
  }

  function beep(freq=900,dur=.12){
    if (!sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='square'; o.frequency.value=freq; g.gain.value=.14;
      o.connect(g); g.connect(ctx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
      o.stop(ctx.currentTime + dur);
    } catch {}
  }

  function build(w){
    const a = [];
    if (w.prep > 0) a.push({label:'ПОДГОТОВКА',duration:w.prep,cycle:0,set:1,type:'prep'});
    for (let s=1; s<=w.sets; s++) {
      for (let c=1; c<=w.cycles; c++) {
        a.push({label:'РАБОТА',duration:w.work,cycle:c,set:s,type:'work'});
        if (c < w.cycles && w.rest > 0) a.push({label:'ОТДЫХ',duration:w.rest,cycle:c,set:s,type:'rest'});
      }
      if (s < w.sets && w.setRest > 0) a.push({label:'ОТДЫХ МЕЖДУ ПОДХОДАМИ',duration:w.setRest,cycle:w.cycles,set:s,type:'rest'});
    }
    if (w.coolDown > 0) a.push({label:'ЗАМИНКА',duration:w.coolDown,cycle:w.cycles,set:w.sets,type:'rest'});
    return a;
  }

  function total(w){ return build(w).reduce((s,p)=>s+p.duration,0); }

  function show(id){
    ['screen','editor','timer'].forEach(x => $(x).classList.add('hidden'));
    $(id).classList.remove('hidden');
  }

  function renderCards(){
    $('cards').innerHTML = workouts.map(w => `
      <article class="card">
        <div class="card-top">
          <h3>${escapeHtml(w.name)}</h3>
          <div class="card-actions">
            <button class="small-btn edit-btn" data-id="${w.id}" aria-label="Изменить">
              <svg class="ui-icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="small-btn play-btn" data-id="${w.id}" aria-label="Запустить">
              <svg class="ui-icon" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg>
            </button>
          </div>
        </div>
        <div class="card-stats">
          <div><span>Работа</span><b>${w.work}</b></div>
          <div><span>Отдых</span><b>${w.rest}</b></div>
          <div><span>Циклы</span><b>${w.cycles}</b></div>
          <div><span>Подходы</span><b>${w.sets}</b></div>
        </div>
        <div class="card-foot">Всего: ${fmt(total(w))} · ${build(w).length} интервалов</div>
      </article>
    `).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const fields = [
    ['prep','Подготовка','сек',0,5],
    ['work','Работа','сек',1,5],
    ['rest','Отдых','сек',0,5],
    ['cycles','Циклы','',1,1],
    ['sets','Подходы','',1,1],
    ['setRest','Отдых между подходами','сек',0,5],
    ['coolDown','Заминка','сек',0,5]
  ];

  function openEditor(id){
    const found = id ? workouts.find(w => w.id === id) : null;
    editing = found ? {...found} : {id:uid(),name:'НОВАЯ ТРЕНИРОВКА',prep:10,work:30,rest:60,cycles:8,sets:1,setRest:120,coolDown:0};
    $('nameInput').value = editing.name;
    $('deleteBtn').classList.toggle('hidden', !found);
    renderEditor();
    show('editor');
  }

  function renderEditor(){
    $('editorList').innerHTML = fields.map(([k,label,unit,min,step]) => `
      <div class="row">
        <span>${label}</span>
        <div class="step">
          <button class="adjust-btn" data-field="${k}" data-delta="-${step}" data-min="${min}">−</button>
          <button class="val pad-btn" data-field="${k}">${editing[k]}${unit ? `<small>${unit}</small>` : ''}</button>
          <button class="adjust-btn" data-field="${k}" data-delta="${step}" data-min="${min}">＋</button>
        </div>
      </div>
    `).join('');
  }

  function commitEditor(){
    editing.name = ($('nameInput').value.trim() || 'ТРЕНИРОВКА').toUpperCase();
    const idx = workouts.findIndex(w => w.id === editing.id);
    if (idx >= 0) workouts[idx] = normalize(editing);
    else workouts.unshift(normalize(editing));
    saveWorkouts();
    renderCards();
  }

  function openPad(field){
    padField = field;
    padDraft = String(editing[field] ?? 0);
    $('numpadValue').textContent = padDraft;
    $('numpad').classList.remove('hidden');
  }

  const keySet = ['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  $('keys').innerHTML = keySet.map(k => `<button data-key="${k}">${k}</button>`).join('');

  function startWorkout(w){
    const clean = normalize(w);
    active = {...clean};
    phases = build(active);
    if (!phases.length) return;
    phaseIndex = 0;
    remainingMs = phases[0].duration * 1000;
    deadline = Date.now() + remainingMs;
    running = true;
    show('timer');
    renderTimer();
    updatePauseIcon();
    startTicker();
    haptic([24,30,48]);
    beep(980,.10);
  }

  function startTicker(){
    clearInterval(tickId);
    tickId = setInterval(() => {
      if (!running || !active) return;
      remainingMs = Math.max(0, deadline - Date.now());
      if (remainingMs <= 0) advance(1, true);
      else {
        const sec = Math.ceil(remainingMs/1000);
        if (sec <= 3 && sec >= 1 && Math.abs(remainingMs - sec*1000) < 280) {
          haptic(sec===1?[40,25,70]:18);
          beep(1200,.07);
        }
        renderTimer(false);
      }
    }, 200);
  }

  function advance(delta, auto=false){
    if (!phases.length) return;
    const next = phaseIndex + delta;
    if (next < 0) {
      phaseIndex = 0;
    } else if (next >= phases.length) {
      if (auto) {
        running = false;
        remainingMs = 0;
        renderTimer();
        updatePauseIcon();
        beep(820,.28);
        haptic([60,40,100]);
        return;
      }
      phaseIndex = phases.length - 1;
    } else {
      phaseIndex = next;
    }
    remainingMs = phases[phaseIndex].duration * 1000;
    deadline = Date.now() + remainingMs;
    if (auto) {
      const p = phases[phaseIndex];
      beep(p.type==='work'?1080:620,.13);
      haptic(p.type==='work'?[34,28,65]:24);
    } else haptic(12);
    renderTimer();
  }

  function setPhase(index){
    if (index < 0 || index >= phases.length) return;
    phaseIndex = index;
    remainingMs = phases[index].duration * 1000;
    deadline = Date.now() + remainingMs;
    renderTimer();
    haptic(12);
  }

  function renderTimer(scroll=true){
    if (!active || !phases.length) return;
    const p = phases[phaseIndex];
    const chrome = p.type==='prep' ? '#10361a' : p.type==='work' ? '#260b13' : '#0b1631';
    document.documentElement.style.setProperty('--chrome', chrome);
    $('phaseBg').className = 'phase-bg ' + p.type;
    $('themeColor').setAttribute('content', chrome);

    const all = phases.reduce((s,x)=>s+x.duration,0);
    const before = phases.slice(0,phaseIndex).reduce((s,x)=>s+x.duration,0);
    const currentElapsed = Math.max(0, p.duration - remainingMs/1000);
    const elapsed = before + currentElapsed;
    const remain = Math.max(0, all - elapsed);

    $('timerSub').textContent = 'Подход ' + p.set + '/' + active.sets + ' · Цикл ' + Math.max(1,p.cycle) + '/' + active.cycles;
    $('phaseTitle').textContent = p.label;
    $('timerNumber').textContent = Math.max(0, Math.ceil(remainingMs/1000));
    $('timerTotal').textContent = '/ ' + p.duration + ' сек';
    $('remainTotal').textContent = fmt(remain);
    $('allTotal').textContent = fmt(all);
    $('progressBar').style.width = (all ? Math.min(100, elapsed/all*100) : 0) + '%';
    $('intervalCounter').textContent = (phaseIndex+1) + '/' + phases.length;

    $('intervals').innerHTML = phases.map((x,i) => `
      <button class="int-row ${i===phaseIndex?'current':''}" data-index="${i}">
        <span class="int-index">${i+1}</span>
        <b class="int-label">${escapeHtml(x.label)}</b>
        <span class="int-duration">${x.duration} сек</span>
      </button>
    `).join('');

    if (scroll) setTimeout(() => document.querySelector('.int-row.current')?.scrollIntoView({block:'center',behavior:'smooth'}), 0);
  }

  function updatePauseIcon(){
    $('pauseBtn').innerHTML = running
      ? '<svg class="ui-icon timer-control-icon" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>'
      : '<svg class="ui-icon timer-control-icon" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg>';
  }

  $('cards').addEventListener('click', e => {
    const edit = e.target.closest('.edit-btn');
    const play = e.target.closest('.play-btn');
    if (edit) { openEditor(edit.dataset.id); haptic(10); }
    if (play) {
      const w = workouts.find(x => x.id === play.dataset.id);
      if (w) startWorkout(w);
    }
  });

  $('addBtn').addEventListener('click', () => { openEditor(null); haptic(10); });
  $('settingsBtn').addEventListener('click', () => $('settings').classList.toggle('hidden'));

  $('editorList').addEventListener('click', e => {
    const adj = e.target.closest('.adjust-btn');
    const pad = e.target.closest('.pad-btn');
    if (adj) {
      const k = adj.dataset.field;
      const min = Number(adj.dataset.min);
      editing[k] = Math.max(min, Number(editing[k]) + Number(adj.dataset.delta));
      renderEditor();
      haptic(8);
    }
    if (pad) openPad(pad.dataset.field);
  });

  $('keys').addEventListener('click', e => {
    const k = e.target.dataset.key;
    if (!k) return;
    haptic(8);
    if (k === '⌫') padDraft = padDraft.slice(0,-1);
    else if (k === '✓') {
      const meta = fields.find(x => x[0] === padField);
      const min = meta ? meta[3] : 0;
      editing[padField] = Math.max(min, Number(padDraft || 0));
      $('numpad').classList.add('hidden');
      renderEditor();
      return;
    } else padDraft = (padDraft === '0' ? k : padDraft + k).slice(0,5);
    $('numpadValue').textContent = padDraft || '0';
  });

  $('numpad').addEventListener('click', e => {
    if (e.target === $('numpad')) $('numpad').classList.add('hidden');
  });

  $('editorBack').addEventListener('click', () => show('screen'));
  $('saveBtn').addEventListener('click', () => { commitEditor(); show('screen'); haptic(12); });
  $('editorStart').addEventListener('click', () => { commitEditor(); startWorkout(editing); });
  $('deleteBtn').addEventListener('click', () => {
    if (!editing) return;
    if (confirm('Удалить тренировку?')) {
      workouts = workouts.filter(w => w.id !== editing.id);
      saveWorkouts();
      renderCards();
      show('screen');
    }
  });

  $('pauseBtn').addEventListener('click', () => {
    if (!active) return;
    if (running) {
      remainingMs = Math.max(0, deadline - Date.now());
      running = false;
    } else {
      deadline = Date.now() + Math.max(0,remainingMs);
      running = true;
    }
    updatePauseIcon();
    haptic(12);
  });

  $('prevBtn').addEventListener('click', () => advance(-1,false));
  $('nextBtn').addEventListener('click', () => advance(1,false));
  $('intervals').addEventListener('click', e => {
    const row = e.target.closest('.int-row');
    if (row) setPhase(Number(row.dataset.index));
  });

  $('exitBtn').addEventListener('click', () => {
    if (running) {
      remainingMs = Math.max(0, deadline - Date.now());
      running = false;
      updatePauseIcon();
    }
    $('exitModal').classList.remove('hidden');
  });

  $('continueBtn').addEventListener('click', () => {
    $('exitModal').classList.add('hidden');
    if (active && remainingMs > 0) {
      deadline = Date.now() + remainingMs;
      running = true;
      updatePauseIcon();
    }
  });

  $('confirmExitBtn').addEventListener('click', () => {
    $('exitModal').classList.add('hidden');
    running = false;
    active = null;
    phases = [];
    clearInterval(tickId);
    document.documentElement.style.setProperty('--chrome','#050505');
    $('themeColor').setAttribute('content','#000000');
    show('screen');
    renderCards();
  });

  $('soundToggle').checked = sound;
  $('vibrateToggle').checked = vibrate;
  $('soundToggle').addEventListener('change', e => {
    sound = e.target.checked;
    savePrefs();
    if (sound) beep(920,.08);
  });
  $('vibrateToggle').addEventListener('change', e => {
    vibrate = e.target.checked;
    savePrefs();
    if (vibrate) haptic(18);
  });

  ['gesturestart','gesturechange'].forEach(type => document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches && e.touches.length>1)e.preventDefault()},{passive:false});
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());

  renderCards();

  const splashStart = performance.now();
  const waitLoad = document.readyState === 'complete'
    ? Promise.resolve()
    : new Promise(r => window.addEventListener('load',r,{once:true}));
  const waitFonts = document.fonts && document.fonts.ready ? document.fonts.ready.catch(()=>{}) : Promise.resolve();
  Promise.race([Promise.all([waitLoad,waitFonts]), new Promise(r=>setTimeout(r,1500))]).then(() => {
    const delay = Math.max(0, 650 - (performance.now()-splashStart));
    setTimeout(() => {
      $('splash').classList.add('hide');
      setTimeout(() => $('splash').classList.add('hidden'), 430);
    }, delay);
  });
})();
</script>
</body>
</html>
