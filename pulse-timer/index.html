<!doctype html><html lang="ru"><head><meta charset="UTF-8" /><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /><meta http-equiv="Pragma" content="no-cache" /><meta http-equiv="Expires" content="0" /><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" /><meta id="themeColor" name="theme-color" content="#000000" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /><title>Pulse Timer</title><style>@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Russo+One&display=swap');*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;min-height:100%;background:#050505;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;color:#fff;font-family:Oswald,system-ui,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;min-height:100dvh;background:#050505;overflow:hidden}button,input{font:inherit}button{color:inherit}.hidden{display:none!important}.splash{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;overflow:hidden;opacity:1;visibility:visible}.logo-wrap{position:relative;z-index:2;text-align:center;animation:logoIn 1.15s cubic-bezier(.18,.8,.2,1) both}.logo{width:168px;filter:drop-shadow(0 0 26px rgba(255,255,255,.26))}.brand{font-family:'Russo One';font-size:18px;letter-spacing:.28em;margin-top:18px}.rings{position:absolute;width:75vmin;height:75vmin;border-radius:50%;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 0 50px rgba(255,255,255,.02),0 0 0 100px rgba(255,255,255,.012);animation:ringPulse 1.5s ease-out infinite}@keyframes logoIn{0%{opacity:0;transform:scale(.9)}55%{opacity:1;transform:scale(1.025)}100%{opacity:1;transform:scale(1)}}@keyframes ringPulse{0%{transform:scale(.75);opacity:.15}70%{opacity:.5}100%{transform:scale(1.12);opacity:0}}.screen,.editor,.timer{position:fixed;inset:0;padding:max(14px,env(safe-area-inset-top)) 16px 0;background:#050505}.screen{background:radial-gradient(circle at 20% 10%,#252525 0,transparent 33%),radial-gradient(circle at 80% 90%,#171717 0,transparent 35%),#050505}.topbar,.editor-head,.timer-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:.22em;color:#888}h1,h2,h3,.phase-title{font-family:'Russo One',sans-serif}h1{font-size:38px;margin:6px 0 0}h2{font-size:24px;margin:0}.icon-btn{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(12,12,12,.55);backdrop-filter:blur(16px);display:grid;place-items:center;padding:0;line-height:0}.settings{margin:14px 0;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#111;padding:10px 14px}.settings label{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07)}.settings label:last-child{border-bottom:0}.settings .switch-control{position:relative;width:48px;height:28px;flex:0 0 48px}.settings .switch-control input{position:absolute;opacity:0;pointer-events:none}.settings .switch-track{position:absolute;inset:0;border-radius:999px;background:#2a2a2a;border:1px solid rgba(255,255,255,.12);transition:.18s ease;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}.settings .switch-track:after{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;border-radius:50%;background:#8b8b8b;transition:.18s ease;box-shadow:0 2px 6px rgba(0,0,0,.35)}.settings .switch-control input:checked + .switch-track{background:#f1f1f1;border-color:#fff}.settings .switch-control input:checked + .switch-track:after{transform:translateX(20px);background:#111}.ui-icon{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.fab .ui-icon{width:28px;height:28px}.small-btn .ui-icon{width:21px;height:21px}.splash.entering{animation:splashDarken .46s cubic-bezier(.2,.74,.2,1) forwards}.splash.entering .logo-wrap{animation:logoDive .46s cubic-bezier(.16,.84,.18,1) forwards}.splash.entering .rings{animation:ringDive .46s cubic-bezier(.16,.84,.18,1) forwards}@keyframes logoDive{0%{transform:scale(1);opacity:1}70%{transform:scale(4.8);opacity:1}100%{transform:scale(10);opacity:0}}@keyframes ringDive{0%{transform:scale(1);opacity:.3}100%{transform:scale(3.4);opacity:0}}@keyframes splashDarken{0%{background:#000;opacity:1}100%{background:#000;opacity:0}}.cards{height:calc(100dvh - 110px - env(safe-area-inset-top));overflow:auto;padding:14px 0 100px;scrollbar-width:none}.cards::-webkit-scrollbar{display:none}.card{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:linear-gradient(155deg,#161616,#070707);padding:18px;margin-bottom:12px}.card-top{display:flex;justify-content:space-between;align-items:center}.card h3{font-size:25px;margin:0}.card-actions{display:flex;gap:8px}.small-btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(20,20,20,.7);display:grid;place-items:center;padding:0;line-height:0}.card-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.card-stats span{display:block;font-size:11px;color:#888}.card-stats b{font-size:24px;font-weight:500}.card-foot{margin-top:14px;color:#999;font-size:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:11px}.fab{position:absolute;right:18px;bottom:max(18px,env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.08);backdrop-filter:blur(18px);display:grid;place-items:center;padding:0;line-height:0}.editor{overflow:auto;background:#050505;padding-left:18px;padding-right:18px}.editor-head{margin-bottom:18px;min-height:58px}.editor-head h2{font-size:28px}.text-btn{background:transparent;border:0;font-size:14px;letter-spacing:.1em;padding:12px 4px}.name-input{width:100%;height:70px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:#111;color:#fff;padding:0 16px;font-family:'Russo One';font-size:26px}.editor-list{margin-top:12px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:#0d0d0d;overflow:hidden}.row{display:flex;align-items:center;justify-content:space-between;min-height:80px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}.row:last-child{border-bottom:0}.row>span{font-size:16px;color:#ddd;line-height:1.15;max-width:46%}.step{display:grid;grid-template-columns:46px 88px 46px;gap:7px;align-items:center}.step button{height:46px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#111;font-size:25px;line-height:1}.val{background:transparent!important;border:0!important;font-size:26px;min-width:88px}.val small{font-size:11px;color:#8e8e8e;margin-left:2px}.start-btn{width:100%;height:70px;margin-top:16px;border-radius:22px;border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.09);backdrop-filter:blur(18px);font-family:'Russo One',Impact,sans-serif;font-size:22px;font-weight:400;letter-spacing:.045em;display:flex;align-items:center;justify-content:center;gap:11px;line-height:1}.start-btn svg{width:22px;height:22px;flex:0 0 auto}.start-label{display:block;transform:translateY(.5px)}.delete-btn{width:100%;border:0;background:transparent;color:#888;padding:18px;font-size:14px}.timer{padding:0 14px 0;background:transparent;bottom:0;min-height:100dvh;isolation:isolate}.phase-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#111;transition:.35s filter}.phase-bg:before,.phase-bg:after{content:"";position:absolute;border-radius:46% 54% 60% 40%/55% 42% 58% 45%;filter:blur(42px) saturate(160%);mix-blend-mode:screen;animation:morph 7s ease-in-out infinite alternate}.phase-bg:before{width:110%;height:70%;left:-5%;top:8%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.9) 0 4%,var(--a) 18%,var(--b) 50%,transparent 72%)}.phase-bg:after{width:90%;height:50%;left:5%;bottom:2%;background:radial-gradient(circle at 50% 50%,var(--c) 0 10%,var(--a) 34%,transparent 70%);animation-duration:5.5s}.phase-bg.prep{--a:#d8ff2a;--b:#51ff6f;--c:#fff7a6;background:#183516}.phase-bg.work{--a:#ff3d22;--b:#7545ff;--c:#ffe772;background:#2c0a10}.phase-bg.rest{--a:#5d79ff;--b:#8b5aff;--c:#c6f6ff;background:#0d1438}.phase-bg.pulse1{animation:bgPulse .55s ease-out}.phase-bg.pulse2{animation:bgPulseStrong .55s ease-out}.phase-bg.pulse3{animation:bgPulseMax .55s ease-out}@keyframes morph{0%{transform:translate(-4%,-2%) scale(.9) rotate(-6deg)}50%{transform:translate(4%,3%) scale(1.06) rotate(3deg)}100%{transform:translate(-2%,5%) scale(.96) rotate(8deg)}}@keyframes bgPulse{0%{filter:brightness(1)}45%{filter:brightness(1.18)}100%{filter:brightness(1)}}@keyframes bgPulseStrong{0%{filter:brightness(1)}45%{filter:brightness(1.4)}100%{filter:brightness(1)}}@keyframes bgPulseMax{0%{filter:brightness(1)}45%{filter:brightness(1.75)}100%{filter:brightness(1)}}.timer-head,.timer-hero,.stats,.intervals,.footer-nav{position:relative;z-index:1}.timer-head{padding-top:max(8px,env(safe-area-inset-top))}.progress{height:5px;flex:1;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}.progress i{display:block;height:100%;background:#fff;width:0%}.timer-hero{text-align:center;padding-top:18px}.timer-sub{font-size:14px;color:#ddd}.phase-title{font-size:clamp(34px,10vw,48px);margin-top:10px}.timer-number{font-family:'Russo One';font-size:clamp(115px,34vw,170px);line-height:.9}.timer-total{font-size:16px;color:#ddd}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-radius:20px;background:rgba(8,8,8,.58);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.11);padding:12px 4px}.stats div{text-align:center;border-right:1px solid rgba(255,255,255,.1)}.stats div:last-child{border-right:0}.stats span{font-size:11px;color:#aaa;display:block}.stats b{font-size:22px}.intervals{height:calc(100dvh - 455px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;margin-top:10px;scrollbar-width:none}.intervals::-webkit-scrollbar{display:none}.int-row{width:100%;min-height:58px;margin-bottom:7px;border-radius:17px;border:1px solid rgba(255,255,255,.16);background:rgba(5,5,5,.62);backdrop-filter:blur(18px);display:grid;grid-template-columns:30px 1fr 65px 26px;align-items:center;padding:0 10px;text-align:left}.int-row.current{border-color:#fff;background:rgba(255,255,255,.11)}.dot{width:23px;height:23px;border-radius:50%;border:1px solid #888;justify-self:end}.current .dot{background:#fff}.footer-nav{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;padding:8px 0 max(8px,env(safe-area-inset-bottom))}.footer-nav button{width:56px;height:56px;border-radius:17px;border:1px solid rgba(255,255,255,.14);background:rgba(5,5,5,.58);font-size:38px}.footer-nav div{text-align:center}.footer-nav small{display:block;font-size:9px;letter-spacing:.15em;color:#888}.footer-nav b{font-size:30px;font-weight:400}.modal,.numpad{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(18px);display:flex;align-items:flex-end;padding:14px}.modal-card,.numpad-card{width:100%;border-radius:26px;background:#111;border:1px solid rgba(255,255,255,.16);padding:18px}.modal-card h3{font-size:26px;margin:8px 0}.modal-card p{color:#aaa}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal-actions button{height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:#171717}.modal-actions .light{background:#fff;color:#000}.numpad-value{font-size:56px;text-align:center;margin:8px 0 16px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{height:66px;border-radius:17px;border:1px solid rgba(255,255,255,.14);background:#151515;font-size:27px}</style></head><body><div id="app"><div class="splash" id="splash"><div class="rings"></div><div class="logo-wrap"><svg class="logo" viewBox="0 0 220 220" aria-label="Pulse Timer logo"><circle cx="110" cy="110" r="78" fill="none" stroke="white" stroke-width="8" opacity=".92"/><path d="M35 112h42l14-24 20 64 19-82 17 42h38" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="168" cy="47" r="7" fill="white"/></svg><div class="brand">PULSE TIMER</div></div></div><main class="screen" id="screen"><div class="topbar"><div><div class="eyebrow">PULSE TIMER</div><h1>ТРЕНИРОВКИ</h1></div><button class="icon-btn" id="settingsBtn" aria-label="Настройки"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.7 2.6h4.6l.7 2.2 2 .8 2.1-1.1 3.2 3.2-1.1 2.1.8 2 .2.7-.2 1.3-.8 2 1.1 2.1-3.2 3.2-2.1-1.1-2 .8-.7 2.2H9.7L9 19.8l-2-.8-2.1 1.1-3.2-3.2 1.1-2.1-.8-2-.2-.7.2-1.3.8-2-1.1-2.1 3.2-3.2L7 6.6l2-.8.7-2.2Z"/><circle cx="12" cy="12" r="3.1"/></svg></button></div><div class="settings hidden" id="settings"><label><span>Звук</span><span class="switch-control"><input type="checkbox" id="soundToggle" checked><span class="switch-track"></span></span></label><label><span>Вибрация</span><span class="switch-control"><input type="checkbox" id="vibrateToggle" checked><span class="switch-track"></span></span></label></div><section class="cards" id="cards"></section><button class="fab" id="addBtn" aria-label="Добавить тренировку"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></main><section class="editor hidden" id="editor"><div class="editor-head"><button class="icon-btn" id="editorBack">‹</button><h2>ТРЕНИРОВКА</h2><button class="text-btn" id="saveBtn">ГОТОВО</button></div><input class="name-input" id="nameInput" /><div class="editor-list" id="editorList"></div><button class="start-btn" id="editorStart"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg><span class="start-label">СТАРТ</span></button><button class="delete-btn" id="deleteBtn">Удалить тренировку</button></section><section class="timer hidden" id="timer"><div class="phase-bg prep" id="phaseBg"></div><div class="timer-head"><button class="icon-btn" id="exitBtn">‹</button><div class="progress"><i id="progressBar"></i></div><button class="icon-btn" id="pauseBtn">Ⅱ</button></div><div class="timer-hero"><div class="timer-sub" id="timerSub"></div><div class="phase-title" id="phaseTitle">ПОДГОТОВКА</div><div class="timer-number" id="timerNumber">10</div><div class="timer-total" id="timerTotal">/ 10 сек</div></div><div class="stats"><div><span>Прошло</span><b id="elapsed">0:00</b></div><div><span>Осталось</span><b id="remainTotal">0:00</b></div><div><span>Всего</span><b id="allTotal">0:00</b></div></div><div class="intervals" id="intervals"></div><div class="footer-nav"><button id="prevBtn">‹</button><div><small>ИНТЕРВАЛ</small><b id="intervalCounter">1/1</b></div><button id="nextBtn">›</button></div></section><div class="modal hidden" id="exitModal"><div class="modal-card"><div class="eyebrow">ТРЕНИРОВКА ИДЁТ</div><h3>Выйти из тренировки?</h3><p>Текущий прогресс будет сброшен.</p><div class="modal-actions"><button id="continueBtn">Продолжить</button><button id="confirmExitBtn" class="light">Выйти</button></div></div></div><div class="numpad hidden" id="numpad"><div class="numpad-card"><div class="numpad-value" id="numpadValue">0</div><div class="keys" id="keys"></div></div></div></div><script>const DEFAULTS = [{id:'press',name:'ПРЕСС',prep:10,work:30,rest:80,cycles:9,sets:1,setRest:150,coolDown:0},{id:'training',name:'ТРЕНИРОВКА',prep:30,work:30,rest:150,cycles:12,sets:3,setRest:180,coolDown:0}];const STORAGE='pulse-timer-standalone-v1';const PREFS='pulse-timer-prefs-v1';let workouts=JSON.parse(localStorage.getItem(STORAGE)||'null')||DEFAULTS;let editing=null, active=null, phases=[], phaseIndex=0, remaining=0, running=false, timerId=null, numField=null, numDraft='0';let prefs={sound:true,vibrate:true};try{prefs={...prefs,...JSON.parse(localStorage.getItem(PREFS)||'{}')}}catch{}let sound=!!prefs.sound, vibrate=!!prefs.vibrate;const $=id=>document.getElementById(id);const fmt=s=>`${Math.floor(Math.max(0,s)/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`;const HAPTICS={entry:[24,32,46],tap:8,toggle:18,start:[28,36,58],phaseWork:[38,34,82],phaseRest:[58,42,34],phasePrep:[24,32,45],countdown3:16,countdown2:28,countdown1:[42,26,68],finish:[70,45,120,55,170],exit:18};async function haptic(kind='tap'){if(!vibrate)return false;const pattern=Array.isArray(kind)||typeof kind==='number'?kind:(HAPTICS[kind]||HAPTICS.tap);try{const cap=window.Capacitor?.Plugins?.Haptics;if(cap){const strong=kind==='finish'||kind==='phaseWork'||kind==='countdown1'||kind==='start';if(cap.impact) await cap.impact({style:strong?'HEAVY':'MEDIUM'});else if(cap.vibrate) await cap.vibrate({duration:Array.isArray(pattern)?Math.max(...pattern):pattern});return true;}}catch{}try{const bridge=window.webkit?.messageHandlers?.PulseHaptics||window.webkit?.messageHandlers?.haptics;if(bridge){bridge.postMessage({kind,pattern});return true;}}catch{}try{if(typeof navigator.vibrate==='function') return navigator.vibrate(pattern);}catch{}return false;}const buzz=p=>haptic(p);function beep(freq=900,dur=.11){if(!sound) return;try{const A=window.AudioContext||window.webkitAudioContext, c=new A(), o=c.createOscillator(), g=c.createGain();o.frequency.value=freq;o.type='square';g.gain.value=.16;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.stop(c.currentTime+dur);}catch{}}function save(){localStorage.setItem(STORAGE,JSON.stringify(workouts));}function build(w){const a=[];if(w.prep>0)a.push({label:'ПОДГОТОВКА',duration:w.prep,cycle:0,set:1,type:'prep'});for(let s=1;s<=w.sets;s++){for(let c=1;c<=w.cycles;c++){a.push({label:'РАБОТА',duration:w.work,cycle:c,set:s,type:'work'});if(c<w.cycles&&w.rest>0)a.push({label:'ОТДЫХ',duration:w.rest,cycle:c,set:s,type:'rest'});}if(s<w.sets&&w.setRest>0)a.push({label:'ОТДЫХ МЕЖДУ ПОДХОДАМИ',duration:w.setRest,cycle:w.cycles,set:s,type:'rest'});}if(w.coolDown>0)a.push({label:'ЗАМИНКА',duration:w.coolDown,cycle:w.cycles,set:w.sets,type:'rest'});return a;}function total(w){return build(w).reduce((x,p)=>x+p.duration,0)}function renderCards(){$('cards').innerHTML=workouts.map(w=>`<article class="card"><div class="card-top"><h3>${w.name}</h3><div class="card-actions"><button class="small-btn edit" data-id="${w.id}" aria-label="Изменить"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></button><button class="small-btn play" data-id="${w.id}" aria-label="Запустить"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg></button></div></div><div class="card-stats"><div><span>Работа</span><b>${w.work}</b></div><div><span>Отдых</span><b>${w.rest}</b></div><div><span>Циклы</span><b>${w.cycles}</b></div><div><span>Подходы</span><b>${w.sets}</b></div></div><div class="card-foot">Всего: ${fmt(total(w))} · ${build(w).length} интервалов</div></article>`).join('');document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEditor(b.dataset.id));document.querySelectorAll('.play').forEach(b=>b.onclick=()=>startWorkout(workouts.find(w=>w.id===b.dataset.id)));}function show(id){['screen','editor','timer'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');}function openEditor(id){const w=id?workouts.find(w=>w.id===id):{id:crypto.randomUUID(),name:'НОВАЯ ТРЕНИРОВКА',prep:10,work:30,rest:60,cycles:8,sets:1,setRest:120,coolDown:0};editing={...w};$('nameInput').value=editing.name;renderEditor();show('editor');}const meta=[['prep','Подготовка','сек',0,5],['work','Работа','сек',1,5],['rest','Отдых','сек',0,5],['cycles','Циклы','',1,1],['sets','Подходы','',1,1],['setRest','Отдых между подходами','сек',0,5],['coolDown','Заминка','сек',0,5]];function renderEditor(){$('editorList').innerHTML=meta.map(([k,l,u,min,step])=>`<div class="row"><span>${l}</span><div class="step"><button onclick="adjust('${k}',-${step},${min})">−</button><button class="val" onclick="openPad('${k}')">${editing[k]}${u?`<small>${u}</small>`:''}</button><button onclick="adjust('${k}',${step},${min})">＋</button></div></div>`).join('');}window.adjust=(k,d,min)=>{editing[k]=Math.max(min,editing[k]+d);renderEditor();haptic('tap')};window.openPad=k=>{numField=k;numDraft=String(editing[k]);$('numpadValue').textContent=numDraft;$('numpad').classList.remove('hidden');};const keySet=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];$('keys').innerHTML=keySet.map(k=>`<button data-k="${k}">${k}</button>`).join('');$('keys').onclick=e=>{const k=e.target.dataset.k;if(!k)return;haptic('tap');if(k==='⌫')numDraft=numDraft.slice(0,-1);else if(k==='✓'){editing[numField]=Math.max(meta.find(x=>x[0]===numField)[3],Number(numDraft||0));$('numpad').classList.add('hidden');renderEditor();return}else numDraft=(numDraft==='0'?k:(numDraft+k)).slice(0,5);$('numpadValue').textContent=numDraft||'0';};function startWorkout(w){active={...w};phases=build(active);phaseIndex=0;remaining=phases[0]?.duration||0;running=true;show('timer');renderTimer();startLoop();pulseStart();haptic('start');}function startLoop(){clearInterval(timerId);timerId=setInterval(()=>{if(!running)return;if(remaining>1){remaining--;countdownPulse();renderTimer();}else{if(phaseIndex<phases.length-1){phaseIndex++;remaining=phases[phaseIndex].duration;beep(phases[phaseIndex].type==='work'?1100:600,.16);haptic(phases[phaseIndex].type==='work'?'phaseWork':phases[phaseIndex].type==='prep'?'phasePrep':'phaseRest');renderTimer();pulseStart();}else{running=false;remaining=0;beep(850,.3);haptic('finish');renderTimer();}}},1000);}function pulseStart(){const bg=$('phaseBg');bg.classList.remove('pulse1','pulse2','pulse3');void bg.offsetWidth;bg.classList.add('pulse3');setTimeout(()=>bg.classList.remove('pulse3'),600)}function countdownPulse(){const bg=$('phaseBg');bg.classList.remove('pulse1','pulse2','pulse3');if(remaining<=3&&remaining>=1){void bg.offsetWidth;bg.classList.add(remaining===3?'pulse1':remaining===2?'pulse2':'pulse3');haptic(remaining===3?'countdown3':remaining===2?'countdown2':'countdown1');beep(1200,.07)}}function renderTimer(){const p=phases[phaseIndex];const phaseChrome=p.type==='prep'?'#183516':p.type==='work'?'#2c0a10':'#0d1438';document.documentElement.style.background=phaseChrome;document.body.style.background=phaseChrome;const tc=document.getElementById('themeColor');if(tc)tc.setAttribute('content',phaseChrome);const  all=phases.reduce((s,x)=>s+x.duration,0), before=phases.slice(0,phaseIndex).reduce((s,x)=>s+x.duration,0), elapsed=before+(p.duration-remaining);$('phaseBg').className=`phase-bg ${p.type}`;$('timerSub').textContent=`Подход ${p.set}/${active.sets} · Цикл ${Math.max(1,p.cycle)}/${active.cycles}`;$('phaseTitle').textContent=p.label;$('timerNumber').textContent=remaining;$('timerTotal').textContent=`/ ${p.duration} сек`;$('elapsed').textContent=fmt(elapsed);$('remainTotal').textContent=fmt(all-elapsed);$('allTotal').textContent=fmt(all);$('progressBar').style.width=`${all?elapsed/all*100:0}%`;$('intervalCounter').textContent=`${phaseIndex+1}/${phases.length}`;$('intervals').innerHTML=phases.map((x,i)=>`<button class="int-row ${i===phaseIndex?'current':''}" data-i="${i}"><span>${i+1}</span><b>${x.label}</b><span>${x.duration} сек</span><i class="dot"></i></button>`).join('');document.querySelectorAll('.int-row').forEach(b=>b.onclick=()=>{phaseIndex=Number(b.dataset.i);remaining=phases[phaseIndex].duration;renderTimer();b.scrollIntoView({block:'center',behavior:'smooth'});pulseStart();haptic('tap')});setTimeout(()=>document.querySelector('.int-row.current')?.scrollIntoView({block:'center'}),20);}$('pauseB turestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());renderCards();let splashTimer=null;let splashEndTimer=null;let splashStartedAt=0;function resetSplashVisuals(splash){const logo=splash.querySelector('.logo-wrap');const rings=splash.querySelector('.rings');if(logo){logo.style.animation='none';void logo.offsetWidth;logo.style.animation='logoIn 1.15s cubic-bezier(.18,.8,.2,1) both';}if(rings){rings.style.animation='none';void rings.offsetWidth;rings.style.animation='ringPulse 1.5s ease-out infinite';}}function playSplash(force=false){const splash=$('splash');if(!splash)return;const now=Date.now();const alreadyVisible=!splash.classList.contains('hidden') && splash.style.opacity!=='0';if(!force && alreadyVisible && now-splashStartedAt<1700)return;splashStartedAt=now;clearTimeout(splashTimer);clearTimeout(splashEndTimer);splash.classList.remove('hidden','entering');splash.style.display='grid';splash.style.opacity='1';splash.style.pointerEvents='auto';resetSplashVisuals(splash);requestAnimationFrame(()=>haptic('entry'));splashTimer=setTimeout(()=>{haptic('tap');splash.classList.add('entering');splashEndTimer=setTimeout(()=>{splash.classList.add('hidden');splash.classList.remove('entering');splash.style.opacity='';splash.style.display='';splash.style.pointerEvents='none';},470);},1550);}function ensureSplashOnEntry(){const splash=$('splash');if(!splash)return;const hidden=splash.classList.contains('hidden') || splash.style.opacity==='0';if(hidden) playSplash(true);}if(document.visibilityState==='visible') playSplash(true);window.addEventListener('pageshow',()=>ensureSplashOnEntry());window.addEven
